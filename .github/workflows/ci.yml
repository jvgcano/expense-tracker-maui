name: Expense Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Build solution
        run: dotnet build ExpenseTracker.slnx --configuration Release

      - name: Run tests
        run: dotnet test ExpenseTracker.slnx --configuration Release --no-build
